# ============================================
# OSLin Shell - Polybar Configuration
# Custom bottom bar: workspaces + tasklist + clock + tray
# Modern, transparent, glass effect
# ============================================

[colors]
background = #0A2540
background-alt = #1E3A5F
foreground = #FFFFFF
foreground-alt = #B0C4DE
primary = #00B4D8
secondary = #0078D4
alert = #FF6B6B
disabled = #555555

[bar/oslin_main]
# ─── Position ───
width = 100%
height = 44pt
radius = 0
bottom = true

# ─── Background (transparent glass) ───
background = ${colors.background}DD
foreground = ${colors.foreground}
line-size = 2
border-size = 0
border-color = ${colors.primary}

# ─── Fonts ───
font-0 = "Noto Sans:size=11;2"
font-1 = "Font Awesome 6 Free:size=11;2"
font-2 = "Noto Sans Arabic:size=11;2"

# ─── Padding ───
padding-left = 8
padding-right = 8
module-margin-left = 4
module-margin-right = 4

# ─── Modules ───
modules-left = launcher workspaces xwindow
modules-center = clock
modules-right = pulseaudio network bluetooth battery date tray powermenu

# ─── Behavior ───
fixed-center = true
scroll-up = #workspaces.prev
scroll-down = #workspaces.next

[module/launcher]
type = custom/text
content = "█"
content-foreground = ${colors.primary}
click-left = rofi -show drun -theme /etc/oslin/shell/rofi/oslin.rasi
click-right = /usr/local/bin/oslin-control-center

[module/workspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.secondary}
label-active-foreground = ${colors.foreground}
label-active-padding = 2
label-occupied = %name%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.foreground-alt}

[module/clock]
type = internal/clock
interval = 1
time = %H:%M
time-alt = %H:%M:%S
label = %time%
label-foreground = ${colors.foreground}
label-font = 2
format = <label>
format-background = ${colors.secondary}
format-padding = 2

[module/date]
type = internal/clock
interval = 5
date = %a %d %b
date-alt = %Y-%m-%d
label = %date%
label-foreground = ${colors.foreground-alt}
format = <label>
format-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}
click-middle = pavucontrol

[module/network]
type = internal/network
interface-type = wireless
label-connected = "%essid%"
label-connected-foreground = ${colors.foreground}
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-disconnected = offline
label-disconnected-foreground = ${colors.disabled}
format-disconnected = <label-disconnected>
format-disconnected-prefix = " "

[module/bluetooth]
type = custom/script
exec = bluetoothctl info | grep -q "Connected: yes" && echo " ON" || echo " OFF"
interval = 5
label-foreground = ${colors.primary}
click-left = blueman-manager

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.primary}
format-discharging = <label-discharging>
format-discharging-prefix = " "
format-discharging-prefix-foreground = ${colors.primary}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = FULL
label-full-foreground = ${colors.primary}

[module/tray]
type = internal/tray
format-margin = 8px
tray-spacing = 8px
tray-size = 60%

[module/powermenu]
type = custom/text
content = "⏻"
content-foreground = ${colors.alert}
click-left = rofi -show power-menu -theme /etc/oslin/shell/rofi/power.rasi -modi power-menu:rofi-power-menu

[settings]
screenchange-reload = true
pseudo-transparency = false
