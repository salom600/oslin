# ============================================
# OSLin Shell - Picom Compositor Configuration
# Blur, transparency, rounded corners, animations
# The "2026 modern feel"
# ============================================

# Backend (glx for hardware accel)
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# VSync (eliminate tearing)
vsync = true;

# ─── Shadows ───
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -6;
shadow-opacity = 0.45;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g = 'Rofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ─── Rounded corners (Win11 / macOS vibe) ───
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'",
    "class_g = 'Polybar'"
];

# ─── Fading (smooth open/close) ───
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'Dunst'"
];

# ─── Transparency ───
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
inactive-dim = 0.0;

# Keep important windows opaque
opacity-rule = [
    "100:class_g = 'Brave-browser'",
    "100:class_g = 'firefox'",
    "100:class_g = 'xfce4-terminal'",
    "100:class_g = 'Pavucontrol'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'"
];

# ─── Blur (frosted glass — the key modern effect) ───
blur-method = "dual_kawase";
blur-strength = 8;
blur-deviation = false;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-kern = "3x3box";
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'"
];

# ─── Wintypes ───
wintypes:
{
    normal = { fade = true; shadow = true; };
    dialog = { fade = true; shadow = true; opacity = 0.95; };
    utility = { fade = true; shadow = false; opacity = 0.9; };
    toolbar = { fade = true; shadow = false; };
    splash = { fade = true; shadow = true; };
    notification = { fade = true; shadow = false; };
    dock = { fade = false; shadow = true; };
    popup_menu = { fade = true; shadow = false; opacity = 0.95; };
    dropdown_menu = { fade = true; shadow = false; opacity = 0.95; };
    tooltip = { fade = true; shadow = false; opacity = 0.9; };
};

# ─── Focus ───
focus-exclude = [
    "class_g = 'Rofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ─── Other ───
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
dbe = false;
xrender-sync-fence = true;
