# ============================================
# OSLin Picom Compositor Configuration
# Modern, animated, transparent, blurred — 2026 feel
# ============================================
# This config enables:
#   - Rounded corners on all windows
#   - Background blur (kwin-like)
#   - Window transparency (inactive windows fade)
#   - Smooth open/close animations
#   - Soft shadows
#   - VSync (no tearing)

# ─── Backend ───
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
use-nearest-sync-pixel = false;

# ─── VSync (eliminate screen tearing) ───
vsync = true;

# ─── Shadows ───
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -6;
shadow-opacity = 0.45;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'Rofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
shadow-ignore-shaped = false;

# ─── Rounded corners (Win11 / macOS vibe) ───
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'",
    "class_g = 'Polybar'"
];
round-borders = 1;

# ─── Fading (smooth open/close transitions) ───
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'Dunst'"
];
no-fading-openclose = false;
no-fading-destroyed-argb = false;

# ─── Transparency / Opacity ───
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
inactive-dim = 0.0;

# Make certain windows always opaque
opacity-rule = [
    "100:class_g = 'Firefox'",
    "100:class_g = 'Brave-browser'",
    "100:class_g = 'Code'",
    "100:class_g = 'Gimp'",
    "100:class_g = 'Inkscape'",
    "100:class_g = ' OBS'",
    "100:class_g = 'mpv'",
    "100:class_g = 'VLC'",
    "100:class_g = 'Pavucontrol'",
    "100:class_g = 'Bottles'",
    "100:class_g = 'Lutris'",
    "100:class_g = 'Steam'",
    "100:class_g = 'Heroic'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'xfce4-terminal'",
    "100:class_g = 'Alacritty'",
    "100:class_g = 'Xfce4-appfinder'"
];

# ─── Blur (the big one — frosted glass effect) ───
blur-method = "dual_kawase";
blur-strength = 8;
blur-deviation = false;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-kern = "3x3box";
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Rofi'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ─── Animations (custom — spring physics) ───
# These give windows a bouncy, modern feel when opening/closing
animation-method = "spring";
animation-dampening = 18;
animation-stiffness = 200;
animation-window-mass = 1.0;
animation-clamping = true;

# ─── Wintypes ───
wintypes:
{
    normal = { fade = true; shadow = true; };
    dialog = { fade = true; shadow = true; opacity = 0.95; };
    utility = { fade = true; shadow = false; opacity = 0.9; };
    toolbar = { fade = true; shadow = false; };
    splash = { fade = true; shadow = true; };
    notification = { fade = true; shadow = false; };
    dock = { fade = false; shadow = true; };
    dnd = { fade = true; shadow = false; };
    popup_menu = { fade = true; shadow = false; opacity = 0.95; };
    dropdown_menu = { fade = true; shadow = false; opacity = 0.95; };
    combo = { fade = true; shadow = false; };
    tooltip = { fade = true; shadow = false; opacity = 0.9; };
    notification = { fade = true; shadow = false; };
    unknown = { fade = true; shadow = true; };
};

# ─── Focus ───
focus-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'Steam'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ─── Other ───
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 0;
dbe = false;
paint-on-overlay = false;
sw-opti = false;

# ─── XSync ───
xrender-sync-fence = true;
